# Telegram Agent Connector vhost — installed verbatim by
# deploy/scripts/remote-deploy.sh as /etc/nginx/sites-available/tac-backend.conf.
#
# Cloudflare is the only client: ufw admits ports 80/443 from its IP ranges
# only (see deploy/scripts/configure-firewall.sh). The origin answers TLS with
# the certificate at /etc/tac/tls — Let's Encrypt symlinks managed by
# bootstrap.sh (DNS-01 via Cloudflare, auto-renewed by cron), or a manually
# provisioned pair — which is what SSL mode "Full (strict)" requires.
# Port 80 stays open for Cloudflare's plain-HTTP probes. Cloudflare
# preserves the original Host header, but since it is the only client this
# vhost is a catch-all (default_server) — nginx never needs to know the domain.

# Exactly one backend process (in-memory QR-login state), so a single upstream.
upstream tac_backend {
    server 127.0.0.1:8300;
    keepalive 32;
}

# Real client IP: behind Cloudflare $remote_addr is a Cloudflare edge IP; the
# visitor's address arrives in CF-Connecting-IP. Fall back to $remote_addr for
# direct (non-proxied) access.
map $http_cf_connecting_ip $client_real_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    # No http2: the directive needs nginx >= 1.25 (Ubuntu 24.04 ships 1.24), and
    # HTTP/1.1 on the Cloudflare-to-origin hop costs nothing — visitors still get
    # HTTP/2 or HTTP/3 from the Cloudflare edge.
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    # Symlinks to the Let's Encrypt live/ pair (or a manually provisioned
    # certificate); paths are stable across renewals.
    ssl_certificate     /etc/tac/tls/origin.pem;
    ssl_certificate_key /etc/tac/tls/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    location / {
        proxy_pass http://tac_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Cloudflare sets X-Forwarded-Proto to the visitor's scheme (https);
        # it is passed through untouched, so no proxy_set_header override here.
    }
}
